name: Sky Watch
on:
  schedule:
    - cron: "54 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: sky-watch
  cancel-in-progress: false
jobs:
  sky-watch:
    name: Sky Watch
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0.
        with:
          client-id: ${{ vars.APPLICATION_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: thatskyapplication
          repositories: sky-watch
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
        with:
          token: ${{ steps.create-token.outputs.token }}
          ref: ${{ github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10.

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0.
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check endpoints
        run: node source/index.ts
        env:
          INPUT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_SKY_BUILD_ACCESS_KEY: ${{ vars.SKY_BUILD_ACCESS_KEY }}
          INPUT_SKY_USER_AGENT: ${{ vars.SKY_USER_AGENT }}

      - name: Commit snapshot changes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name thatskyapplication[bot]
          git config user.email "${{ vars.APPLICATION_USER_ID }}+thatskyapplication[bot]@users.noreply.github.com"
          mkdir -p snapshots
          git add snapshots

          if git diff --cached --quiet; then
            echo "::notice::No snapshot changes to commit."
            exit 0
          fi

          git commit --message "chore: update snapshots"
          git push origin "HEAD:$REF_NAME"
